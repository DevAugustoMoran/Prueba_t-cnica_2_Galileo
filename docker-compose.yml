services:
  mariadb:
    image: mariadb:10.11
    environment:
      - MARIADB_USER=usuariomoodle
      - MARIADB_PASSWORD=clavesegura
      - MARIADB_DATABASE=moodle_db
      - MARIADB_ROOT_PASSWORD=claveroot
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      # Script oficial de la propia imagen, pensado para no dar falso
      # positivo durante el arranque en dos etapas del primer boot (instancia
      # temporal de inicialización -> reinicio -> instancia final real).
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  moodle:
    build: .
    ports:
      - "8080:80"
    volumes:
      - moodledata:/var/www/moodledata
      - ./src_plugin/local_mejoras_examen:/var/www/html/local/mejoras_examen
      - ./src_plugin/local_qa_seed:/var/www/html/local/qa_seed
      - ./config.php:/var/www/html/config.php
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb_data:
  moodledata: